<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil do Studio</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fdf2f8 0%, #f5f3ff 100%);
        font-family: Arial, sans-serif;
        color: #1f2937;
      }
      .card {
        background: white;
        border-radius: 18px;
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
        padding: 2rem;
        width: min(420px, calc(100vw - 32px));
        text-align: center;
      }
      .badge {
        display: inline-flex;
        padding: 0.4rem 0.75rem;
        border-radius: 999px;
        background: #f3e8ff;
        color: #7c3aed;
        font-weight: 700;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0.25rem 0;
        color: #475569;
      }
      code {
        background: #f8fafc;
        padding: 0.2rem 0.45rem;
        border-radius: 0.4rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Studio de Cílios</div>
      <h1>Perfil do cliente</h1>
      <p>Identificador:</p>
      <p><code id="perfil-id">studio-cliente</code></p>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || 'studio-cliente';
      document.getElementById('perfil-id').textContent = id;
    </script>
  </body>
</html>
