<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil do Cliente</title>
    <style>
      :root {
        --bg: #fff7fb;
        --card: #ffffff;
        --primary: #a855f7;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fdf2f8 0%, #f5f3ff 100%);
        font-family: Arial, sans-serif;
        color: var(--text);
      }

      .card {
        width: min(92vw, 420px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 18px 40px rgba(168, 85, 247, 0.12);
        padding: 28px;
        text-align: center;
      }

      .photo {
        width: 120px;
        height: 120px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid rgba(168, 85, 247, 0.2);
        display: block;
        margin: 0 auto 16px;
        background: #f3f4f6;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.6rem, 2vw, 2rem);
      }

      .cargo {
        margin: 0 0 16px;
        color: var(--primary);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 0.8rem;
      }

      .meta {
        margin-top: 14px;
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img id="foto" class="photo" alt="Foto do cliente" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=500&q=80">
      <h1 id="nome">Carregando...</h1>
      <p id="cargo" class="cargo">Cliente</p>
      <p class="meta">Perfil validado no Studio de Cílios</p>
    </main>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('id');

      const nomeEl = document.getElementById('nome');
      const cargoEl = document.getElementById('cargo');
      const fotoEl = document.getElementById('foto');

      fetch(`/api/usuarios/${userId || 'studio-cliente'}`)
        .then(async (response) => {
          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(data.mensagem || 'Usuário não encontrado');
          }

          return data;
        })
        .then((data) => {
          if (data.nome) nomeEl.textContent = data.nome;
          if (data.cargo) cargoEl.textContent = data.cargo;
          if (data.fotoUrl) fotoEl.src = data.fotoUrl;
        })
        .catch(() => {
          nomeEl.textContent = 'Usuário não encontrado';
          cargoEl.textContent = 'Perfil indisponível';
        });
    </script>
  </body>
</html>
