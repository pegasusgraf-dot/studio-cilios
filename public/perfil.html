<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Perfil</title>
</head>
<body>
  <h1 id="nome">Carregando...</h1>
  <p id="cargo"></p>
  <img id="foto" alt="Foto do usuário" width="120">
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id');

    fetch(`/api/usuarios/${userId}`)
      .then((res) => res.json())
      .then((data) => {
        document.getElementById('nome').textContent = data.nome;
        document.getElementById('cargo').textContent = data.cargo;
        document.getElementById('foto').src = data.fotoUrl;
      })
      .catch(() => {
        document.getElementById('nome').textContent = 'Usuário não encontrado';
      });
  </script>
</body>
</html>
