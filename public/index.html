<section class="view-panel admin-only" id="cadastros-view" hidden>
  <div class="section-heading">
    <h2>Gerenciar Catálogo de Tratamentos</h2>
  </div>
  <div class="management-grid">
    <section class="management-panel card">
      <h3>Cadastrar ou Editar Procedimento</h3>
      <form id="service-form" class="form-stack compact-form" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
        <input type="hidden" name="id" id="service-id" value="">
        <label class="field">Nome do Procedimento
          <input type="text" name="nome" required placeholder="Ex: Extensão Volume Russo" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:4px;">
        </label>
        <label class="field">Valor (R$)
          <input type="number" step="0.01" name="valor" required placeholder="120.00" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:4px;">
        </label>
        <label class="field">Duração (minutos)
          <input type="number" name="duracao_minutos" required placeholder="90" style="width:100%; padding:8px; border:1px solid #ced4da; border-radius:4px;">
        </label>
        <div style="display: flex; gap: 8px; margin-top: 5px;">
          <button id="service-submit" type="submit" class="button button-primary" style="background: #a855f7; color:white; border:none; padding:10px 15px; border-radius:6px; cursor:pointer; flex: 1;">Adicionar serviço</button>
          <button id="service-cancel" type="button" class="button button-secondary" hidden style="background: #64748b; color:white; border:none; padding:10px 15px; border-radius:6px; cursor:pointer;">Cancelar</button>
        </div>
        <p class="form-message" id="service-message" role="status"></p>
      </form>
    </section>
    <section class="management-panel card">
      <h3>Procedimentos Cadastrados</h3>
      <div class="management-list items-list" id="service-list" style="margin-top: 10px;"></div>
    </section>
  </div>
</section>
