<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Cílios</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #fff7fb; color: #2d2d2d; margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); margin-bottom: 20px; }
    h1,h2,h3 { margin-top: 0; }
    form { display: grid; gap: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    input, button, select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #e1d5dc; font-size: 14px; }
    button { background: #d94f9a; color: white; border: none; cursor: pointer; font-weight: 700; }
    button.secondary { background: #f2c5d9; color: #3f1f2e; }
    .status { margin-top: 10px; min-height: 24px; font-size: 14px; color: #6b2d58; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border-bottom: 1px solid #eee; padding: 10px 8px; text-align: left; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Studio Cílios</h1>

    <div class="panel">
      <h2>Login</h2>
      <form id="loginForm">
        <div class="grid">
          <input type="email" id="loginEmail" placeholder="E-mail" required />
          <input type="password" id="loginSenha" placeholder="Senha" required />
        </div>
        <button type="submit">Entrar</button>
      </form>
      <div id="loginStatus" class="status"></div>
    </div>

    <div class="panel">
      <h2>Cadastro</h2>
      <form id="cadastroForm">
        <div class="grid">
          <input type="text" id="cadastroNome" placeholder="Nome" required />
          <input type="email" id="cadastroEmail" placeholder="E-mail" required />
          <input type="password" id="cadastroSenha" placeholder="Senha" required />
        </div>
        <button type="submit">Cadastrar</button>
      </form>
      <div id="cadastroStatus" class="status"></div>
    </div>

    <div class="panel">
      <h2>Serviços</h2>
      <form id="servicoForm">
        <div class="grid">
          <input type="text" id="servicoNome" placeholder="Nome do serviço" required />
          <input type="number" step="0.01" id="servicoValor" placeholder="Valor" required />
          <input type="number" id="servicoDuracao" placeholder="Duração em minutos" required />
        </div>
        <button type="submit">Salvar serviço</button>
      </form>
      <div id="servicoStatus" class="status"></div>
      <div id="servicosList"></div>
    </div>

    <div class="panel">
      <h2>Agendamentos</h2>
      <form id="agendamentoForm">
        <div class="grid">
          <input type="text" id="agendamentoData" placeholder="Data e hora (ex.: 2026-12-05T15:30)" required />
          <select id="agendamentoServico"></select>
          <input type="text" id="agendamentoUsuario" placeholder="Usuário ID (opcional)" />
        </div>
        <button type="submit">Criar agendamento</button>
      </form>
      <div id="agendamentoStatus" class="status"></div>
      <div id="agendamentosList"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
